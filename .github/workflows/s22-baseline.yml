name: s22-baseline

on:
  push:
  pull_request:

jobs:
  security-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run s22 baseline tests
        run: python -m pytest tests/security tests/runtime
